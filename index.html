<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reverse: Tracker</title>

  <meta name="description" content="Summon tracker for Reverse 1999. Import your pull history, track pity, banner statistics and 6★ character drops.">
  <meta name="author" content="The 1999: Summon Tracker">
  <meta name="robots" content="index, follow">

  <link rel="icon" href="static/ui/favicon.ico" type="image/x-icon">
  <link rel="canonical" href="https://lonelytragedy.github.io/r1999-tracker/">
  <link rel="stylesheet" href="styles.css">
  <script src="lang-init.js"></script>
  <script src="icons.js" defer></script>
  <script src="database.js" defer></script>
  <script src="net.js"></script>
  <script src="gdrive.js" defer></script>
</head>
<body>
  <div id="top-bar"></div>

  <div class="top-row" style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;">
    <h1 class="site-header" style="margin:0;">
      <img src="static/ui/logo.png" alt="Logo" class="site-logo">
      <span class="site-title">Reverse<span class="site-title-colon">:</span> Tracker</span>
    </h1>
    <label class="m-only m-profile">
      <span class="m-profile-dot" id="mProfileDot"></span>
      <span class="m-profile-text">
        <span class="m-profile-name" id="mProfileName"></span>
        <span class="m-profile-uid" id="mProfileUid"></span>
      </span>
      <select id="profileSelectTop" onchange="switchProfile(this.value)" data-i18n-title="mProfile"></select>
    </label>
    <button type="button" class="m-only m-import-btn" onclick="openImportSheet()" data-i18n-title="mImport" aria-label="Import">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/></svg>
    </button>
    <div class="settings" id="settings">
      <button class="settings-gear" id="settingsGear" onclick="toggleSettings(event)" aria-label="Settings" title="Settings"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg></button>
      <div class="settings-panel" id="settingsPanel">
        <div class="settings-row">
          <span class="settings-label" data-i18n="settingsLanguage"></span>
          <div class="settings-seg">
            <button class="banner-toggle-btn" id="langRU" onclick="setLang('ru')"><img class="lang-btn-flag" src="static/ui/flag_ru.png" alt=""> RU</button>
            <button class="banner-toggle-btn" id="langEN" onclick="setLang('en')"><img class="lang-btn-flag" src="static/ui/flag_en.png" alt=""> EN</button>
          </div>
        </div>
        <div class="settings-row">
          <span class="settings-label" data-i18n="settingsSkin"></span>
          <div class="settings-seg">
            <button class="banner-toggle-btn" id="skinReversed" onclick="setSkin('reversed')" data-i18n="skinReversed"></button>
            <button class="banner-toggle-btn" id="skinClassic" onclick="setSkin('classic')" data-i18n="skinClassic"></button>
          </div>
        </div>
        <div class="settings-row settings-stack" id="remindersRow" hidden>
          <span class="settings-label" data-i18n="settingsReminders"></span>
          <div class="settings-seg">
            <button class="banner-toggle-btn" id="remindStart" onclick="toggleReminder('start')" data-i18n="remindStart"></button>
            <button class="banner-toggle-btn" id="remindEnd" onclick="toggleReminder('end')" data-i18n="remindEnd"></button>
          </div>
        </div>
        <div class="settings-links">
          <a href="guide.html" class="side-btn" data-i18n="guideBtn" data-icon="book"></a>
          <a href="https://docs.google.com/spreadsheets/u/1/d/e/2PACX-1vSZ_xS_5dfuvV7-yfitOqCw7e8VVkqtfWCAkcFpXLYTvx7XXR7lg2e1wjTLBZJJAleeEKm-f1Y7gNI_/pubhtml"
             target="_blank" class="side-btn" data-i18n="bannerHistoryBtn" data-icon="history"></a>
        </div>
      </div>
    </div>
  </div>

  <div class="offline-bar" id="offlineBar" role="status">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.94 5.274A7 7 0 0 1 15.71 10h1.79a4.5 4.5 0 0 1 4.222 6.057"/><path d="M18.796 18.81A4.5 4.5 0 0 1 17.5 19H9A7 7 0 0 1 5.79 5.78"/><path d="m2 2 20 20"/></svg>
    <span class="offline-bar-text"><b data-i18n="offlineBarTitle"></b><span data-i18n="offlineBarText"></span></span>
  </div>

  <div class="sheet-backdrop m-only" id="sheetBackdrop" onclick="closeImportSheet()"></div>
  <div class="box import-box" id="importBox" role="dialog" aria-labelledby="importTitle">
    <div class="sheet-grip m-only"></div>
    <div class="box-header">
      <h2 id="importTitle"><span class="d-only" data-i18n="dbManagement"></span><span class="m-only" data-i18n="mAddPulls"></span></h2>
      <button type="button" class="m-only sheet-close" onclick="closeImportSheet()" data-i18n-title="mClose" aria-label="Close">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
    <button type="button" class="m-only in-app-only m-autolink" onclick="openNativeImport()">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
      <span data-i18n="mAutoLink"></span>
    </button>

    <hr style="border:0; border-top:1px solid rgba(216,180,106,0.15); margin:12px 0;">

    <div class="url-import">
      <label class="m-only m-url-label" for="urlInput" data-i18n="mUrlLabel"></label>
      <input type="text" id="urlInput" data-i18n-placeholder="urlPlaceholder">
      <button onclick="loadFromURL()" data-i18n="importUrlBtn" data-icon="link"></button>
    </div>

    <hr style="border:0; border-top:1px solid rgba(216,180,106,0.15); margin:12px 0;">

    <div class="file-upload profile-bar">
      <div>
        <input type="file" id="fileInput" style="display:none">
        <button onclick="document.getElementById('fileInput').click()" data-i18n="selectFileBtn" data-icon="fileJson"></button>
        <span style="font-size:14px; color:#9aa0a6; margin-left:8px;" data-i18n="selectFileHint"></span>
      </div>
      <div class="profiles">
        <select id="profileSelect" onchange="switchProfile(this.value)"></select>
        <button onclick="addProfile()" aria-label="+"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
        <button onclick="removeProfile()" aria-label="−"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>
      </div>
    </div>

    <hr style="border:0; border-top:1px solid rgba(216,180,106,0.15); margin:12px 0;">

    <div class="db-buttons-row">
      <input type="file" id="dbInput" style="display:none">
      <button class="db-btn" onclick="exportDB()" data-i18n="exportDbBtn" data-icon="download"></button>
      <button class="db-btn" onclick="document.getElementById('dbInput').click()" data-i18n="importDbBtn" data-icon="upload"></button>
      <div class="db-btn-divider"></div>
      <div class="gdrive-block">
        <img src="static/ui/gdrive.png" alt="Google Drive" class="gdrive-icon" onerror="this.style.display='none'">
        <span class="m-only gdrive-cloud"><svg class="icon gd-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg><svg class="icon gd-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m17 15-5.5 5.5L9 18"/><path d="M5.516 16.07A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 3.501 7.327"/></svg><svg class="icon gd-warn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 12v4"/><path d="M12 20h.01"/><path d="M8.128 16.949A7 7 0 1 1 15.71 8h1.79a1 1 0 0 1 0 9h-1.642"/></svg></span>
        <span class="gdrive-text">
          <span class="m-only gdrive-title">Google Drive</span>
          <span id="gdriveStatus" class="gdrive-status" data-i18n="gdriveNotConnected"></span>
        </span>
        <button id="gdriveSignInBtn"  class="db-btn gdrive-btn-signin"  onclick="gdriveSignIn()"><span class="d-only" data-i18n="gdriveConnect"></span><span class="m-only" data-i18n="mConnect"></span></button>
        <button id="gdriveSignOutBtn" class="db-btn gdrive-btn-signout" onclick="gdriveSignOut()" style="display:none" data-i18n="gdriveDisconnect"></button>
      </div>
    </div>
  </div>

  <section class="box m-only" id="mPityBox" aria-labelledby="mPityTitle">
    <div class="m-sec-head">
      <h2 id="mPityTitle" data-i18n="mPityTitle"></h2>
      <span class="m-sec-sub" id="mPullsTotal"></span>
    </div>
    <div class="m-pity-grid" id="mPity"></div>
    <div class="m-empty" id="mEmpty">
      <p data-i18n="mEmptyText"></p>
      <button type="button" class="m-primary" onclick="openImportSheet()" data-i18n="mAddPulls"></button>
    </div>
  </section>

  <div class="box collapsed" id="bannerTimelineBox">
    <div class="banner-box-header">
      <h2 id="bannerBoxTitle" data-i18n="bannerTimeline"></h2>
      <div style="display:flex; align-items:center; gap:10px;">
        <label class="tl-tz-toggle" id="tlTzToggle">
          <input type="checkbox" id="tlLocalTimeCheck" onchange="toggleTlLocalTime(this.checked)">
          <span data-i18n="tlLocalTime"></span>
          <span class="tl-tz-label" id="tlTzLabel"></span>
        </label>
        <button type="button" class="m-only m-link" id="mViewSwitch" onclick="toggleMobileBannerView()"></button>
        <div class="banner-view-toggle">
          <button class="banner-toggle-btn active" id="toggleTimeline" onclick="setBannerView('timeline')" data-i18n="viewTimeline"></button>
          <button class="banner-toggle-btn" id="toggleGrid" onclick="setBannerView('grid')" data-i18n="viewGrid"></button>
        </div>
      </div>
    </div>
    <div class="banner-view-panel">
      <div id="bannerTimelineWrap" class="banner-timeline-wrap"></div>
      <div id="activeBannersWrap" class="collapse-body" style="display:none;">
        <div class="active-banners-grid" id="activeBanners"></div>
      </div>
    </div>
    <button class="recent-toggle" onclick="toggleCollapse('bannerTimelineBox')"></button>
  </div>

  <div class="box collapsed" id="statsBox">
    <h2 data-i18n="statistics"></h2>
    <div class="collapse-body">
      <div class="stats" id="stats"></div>
      <div class="banner-stats-row" id="bannerStats"></div>
    </div>
    <button class="recent-toggle" onclick="toggleCollapse('statsBox')"></button>
  </div>

  <div class="box collapsed" id="recentSixStarsBox">
    <div class="sec-head">
      <h2><span class="d-only" data-i18n="recentSixStars"></span><span class="m-only" data-i18n="mRecentSix"></span></h2>
      <span class="m-only m-sec-sub" id="mFiftyStat"></span>
    </div>
    <div class="recent-six-stars collapse-body" id="recentSixStars"></div>
    <button class="recent-toggle" id="recentToggle" onclick="toggleRecent()"></button>
  </div>

  <div class="box" id="chartsBox">
    <div class="charts-header" onclick="toggleChartsBox()">
      <h2 data-i18n="chartsTitle"></h2>
      <span class="charts-toggle-arrow" id="chartsArrow">▾</span>
    </div>
    <div id="chartsContent" style="display:none">
      <h3 data-i18n="pityChart"></h3>
      <canvas id="pityChart"></canvas>
      <h3 data-i18n="monthlyChart"></h3>
      <canvas id="chart"></canvas>
    </div>
  </div>

  <div class="box" id="historyBox">
    <h2 data-i18n="pullHistory"></h2>
    <div class="filter-bar">
      <div class="filter-group">
        <span data-i18n="filterRarity"></span>
        <div class="filter-pills">
          <button class="filter-all active" onclick="filterByRarity(0,this)" data-i18n="filterAll"></button>
          <button class="r6" data-f="6" onclick="filterByRarity(6,this)">6★</button>
          <button class="r5" data-f="5" onclick="filterByRarity(5,this)">5★</button>
          <button class="r4" data-f="4" onclick="filterByRarity(4,this)">4★</button>
          <button class="r3" data-f="3" onclick="filterByRarity(3,this)">3★</button>
          <button class="r2" data-f="2" onclick="filterByRarity(2,this)">2★</button>
        </div>
      </div>
      <div class="filter-group">
        <span data-i18n="filterBannerType"></span>
        <div class="filter-pills">
          <button class="filter-type-all active" onclick="filterByType(null,this)" data-i18n="filterAll"></button>
          <button class="filter-type type-limited"   data-f="Limited" onclick="filterByType('Limited',this)">Limited</button>
          <button class="filter-type type-collaboration" data-f="Collab" onclick="filterByType('Collab',this)">Collab</button>
          <button class="filter-type type-character" data-f="Character" onclick="filterByType('Character',this)">Character</button>
          <button class="filter-type type-water"     data-f="Water" onclick="filterByType('Water',this)">Water</button>
          <button class="filter-type type-regular"   data-f="Regular" onclick="filterByType('Regular',this)">Regular</button>
          <button class="filter-type type-special"   data-f="Special" onclick="filterByType('Special',this)">Special</button>
        </div>
      </div>
    </div>
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th style="width:28px;"></th>
            <th style="width:52px; text-align:center;" data-i18n-title="thTotalPulls">№</th>
            <th data-i18n="thBanner"></th>
            <th data-i18n="thPity"></th>
            <th data-i18n="thCharacter"></th>
            <th style="text-align:right;" data-i18n="thDate"></th>
          </tr>
        </thead>
        <tbody id="table"></tbody>
      </table>
    </div>
  </div>

  <nav class="m-nav m-only" id="mNav" aria-label="Sections">
    <a href="#" data-target="top" class="active" onclick="mNavGo(event,this)">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <span data-i18n="mNavOverview"></span></a>
    <a href="#" data-target="bannerTimelineBox" onclick="mNavGo(event,this)">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M16 2v3"/><path d="M3 9h18"/><path d="M8 2v3"/><path d="M17 13h-6"/><path d="M13 17H7"/><path d="M7 13h.01"/><path d="M17 17h.01"/></svg>
      <span data-i18n="mNavBanners"></span></a>
    <a href="#" data-target="statsBox" onclick="mNavGo(event,this)">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>
      <span data-i18n="mNavStats"></span></a>
    <a href="#" data-target="historyBox" onclick="mNavGo(event,this)">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h.01"/><path d="M3 12h.01"/><path d="M3 19h.01"/><path d="M8 5h13"/><path d="M8 12h13"/><path d="M8 19h13"/></svg>
      <span data-i18n="mNavHistory"></span></a>
    <a href="#" class="in-app-only" onclick="event.preventDefault();openNativeImport()">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
      <span data-i18n="mNavLink"></span></a>
  </nav>

  <p class="version-footer">Version 3.3 soft</p>

  <button id="scrollTopBtn" onclick="window.scrollTo({top:0,behavior:'smooth'})" data-i18n-title="scrollTop"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg></button>

  <script src="scripts.js" defer></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
        navigator.serviceWorker.ready.then(() => setTimeout(() => window.cacheBannerArt?.(), 1500));
      });
    }
  </script>
</body>
</html>
